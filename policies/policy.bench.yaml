policy_version: "bench-1"

tenants:
  default:
    latency_slo_ms: 5000
    caching:
      exact_enabled: true
      semantic:
        enabled: true
        threshold: 0.85       # tuned: catches genuine rephrasings, rejects unrelated
        ttl_seconds: 3600
        verifier: "off"

  premium:
    latency_slo_ms: 3000
    caching:
      exact_enabled: true
      semantic:
        enabled: true
        threshold: 0.92       # stricter for premium — fewer false positives
        ttl_seconds: 1800
        verifier: "off"

routing:
  length_buckets:
    short:  { max_chars: 800 }
    medium: { max_chars: 2400 }
    long:   { max_chars: 1000000 }

plans:
  short:
    tier: "standard"
    decoding_profile: "fast"
    max_tokens: 256
    temperature: 0.7
  medium:
    tier: "standard"
    decoding_profile: "standard"
    max_tokens: 512
    temperature: 0.7
  long:
    tier: "standard"
    decoding_profile: "accurate"
    max_tokens: 1024
    temperature: 0.7

scheduler:
  short_max_prompt_chars: 1200
  workers: 4                       # bumped for benchmark throughput
  max_queue_depth_per_lane: 100
  admission:
    enabled: true
    default_compute_ms:
      short: 1500
      long: 4000
    degrade:
      enabled: true
      max_tokens_floor: 128
      max_tokens_scale: 0.5
    reject:
      enabled: true
      retry_after_seconds: 2
